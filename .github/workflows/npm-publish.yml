name: Publish package to npm

on:
  # Publie la librairie sur npmjs.com quand tu crées une release GitHub.
  release:
    types: [published]
  workflow_dispatch:

# id-token: write => authentification OIDC "Trusted Publishing" (aucun token npm
# à stocker, aucune 2FA à gérer). contents: read pour le checkout.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) nécessite npm >= 11.5.1.
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Aligne la version du package sur le tag de la release (sans le « v »).
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # `prepublishOnly` (npm run build) reconstruit dist/ juste avant le publish.
      # OIDC : pas de NODE_AUTH_TOKEN, npm échange le jeton OIDC automatiquement.
      - name: Publish
        run: npm publish
