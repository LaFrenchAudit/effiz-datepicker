name: Publish package to GitHub Packages

on:
  # Publie la librairie sur GitHub Packages quand tu crées une release GitHub.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # autorise le GITHUB_TOKEN à publier le package

jobs:
  publish:
    name: Build and publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lafrenchaudit'

      - name: Install dependencies
        run: npm ci

      # Aligne la version publiée sur le tag de la release (sans le « v »).
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # `prepublishOnly` (npm run build) reconstruit dist/ juste avant le publish.
      # Auth via le GITHUB_TOKEN de l'exécution — aucun secret npm, aucune 2FA.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
