name: Publish package to npm

on:
  # Publie la librairie sur npmjs.com quand tu crées une release GitHub.
  release:
    types: [published]
  workflow_dispatch:

# id-token: write => authentification OIDC "Trusted Publishing" (aucun secret).
# contents: read pour le checkout.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: self-hosted
    # Exposé pour brancher l'amorçage par token (voir plus bas). Vide => OIDC.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # Trusted Publishing (OIDC) nécessite npm >= 11.5.1.
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Aligne la version du package sur le tag de la release (sans le « v »).
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Régime permanent : OIDC, aucun secret. `prepublishOnly` build dist/.
      - name: Publish (OIDC trusted publishing)
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish

      # Amorçage ponctuel : l'OIDC ne peut pas créer un package inexistant, donc
      # on autorise un publish par token *bypass 2FA* si le secret NPM_TOKEN est
      # défini. À supprimer une fois l'OIDC configuré sur le package.
      - name: Publish (bootstrap via npm token)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish
          rm -f .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
