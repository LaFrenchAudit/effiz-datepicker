server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # French accents in llms.txt / llms-full.txt and HTML.
    charset utf-8;
    source_charset utf-8;

    # Serve gzip-precompressed assets when available; compress the rest.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for content-hashed build assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Machine/AI docs and other root files: served directly, no caching surprises.
    location = /api.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }
    location = /llms-full.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    # Single-page app: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
